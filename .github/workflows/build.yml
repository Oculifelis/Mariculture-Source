name: build
on:
  push:
  pull_request:

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: tools/build-all.sh domain

  target:
    needs: domain
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: forge-1.20.1, java: '17' }
          - { target: neoforge-1.21.1, java: '21' }
          - { target: neoforge-26.1.2, java: '25' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '${{ matrix.java }}' }
      - run: tools/build-all.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mariculture-${{ matrix.target }}
          path: targets/${{ matrix.target }}/build/libs/*.jar
