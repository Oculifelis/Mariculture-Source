org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

minecraft_version=26.2
# Pins are recorded with their source in docs/toolchains.md. Values marked TO_PIN fail the build on purpose.
# 26.1 is unobfuscated: no Parchment/mappings are configured for this target.
