java_version=25
# Optional integrations (compile-only; -PwithCompat also runs them). See docs/toolchains.md.
# No KubeJS and no Patchouli exist for 26.2 yet: the KubeJS binding is left out and the guide book needs Patchouli.
jei_version=30.42.0.237
jade_version=26.2.10+neoforge
hephaestus_file=9293064
# Curios API (required since 0.5.0): jewelry is worn in its ring, bracelet and necklace slots.
curios_version=16.0.0+26.2
